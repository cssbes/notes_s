name: Build unsigned IPA

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          echo "=== Build Environment ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "Xcode: $(xcodebuild -version 2>&1)"
          echo "Swift: $(swift --version 2>&1)"
          echo "xcode-select: $(xcode-select -p 2>&1)"

      - name: List available SDKs
        run: xcodebuild -showsdks

      - name: Build unsigned archive (Debug config)
        run: |
          xcodebuild clean build \
            -project notes_s.xcodeproj \
            -scheme notes_s \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 || true

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== Xcodebuild failed ==="
          find "$RUNNER_TEMP/DerivedData" -name "*.log" -type f 2>/dev/null | head -5
          echo "=== Attempting build with verbose errors ==="
          xcodebuild build \
            -project notes_s.xcodeproj \
            -scheme notes_s \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/DerivedData2 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_STRICT_CONCURRENCY=minimum \
            2>&1
