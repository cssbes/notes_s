name: Build unsigned IPA

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project notes_s.xcodeproj \
            -scheme notes_s \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/notes_s.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" | tee "$RUNNER_TEMP/build.log"

      - name: Create unsigned IPA manually
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          APP=$(ls "$RUNNER_TEMP/notes_s.xcarchive/Products/Applications/" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in archive"
            ls -la "$RUNNER_TEMP/notes_s.xcarchive/Products/Applications/" 2>/dev/null || true
            ls -la "$RUNNER_TEMP/notes_s.xcarchive/Products/" 2>/dev/null || true
            exit 1
          fi
          cp -r "$RUNNER_TEMP/notes_s.xcarchive/Products/Applications/$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "notes_s.ipa" "Payload" -x "._*" -x ".DS_Store"
          echo "IPA created at: $RUNNER_TEMP/ipa/notes_s.ipa"
          ls -la "$RUNNER_TEMP/ipa/notes_s.ipa"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes_s-unsigned
          path: ${{ runner.temp }}/ipa/notes_s.ipa

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -n "error:" "$RUNNER_TEMP/build.log" 2>/dev/null | head -30
          echo "=== ARCHIVE CONTENTS ==="
          find "$RUNNER_TEMP/notes_s.xcarchive" -maxdepth 4 -type d 2>/dev/null || echo "No archive"
