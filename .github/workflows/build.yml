name: Build unsigned IPA

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project notes_s.xcodeproj \
            -scheme notes_s \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/notes_s.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" | tee "$RUNNER_TEMP/build.log"

      - name: Export unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/notes_s.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist | tee "$RUNNER_TEMP/export.log"

      - name: List export directory
        if: always()
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "Contents of ipa dir:"
          ls -la "$RUNNER_TEMP/ipa/" 2>&1 || echo "No ipa dir"
          echo "Looking for any .ipa:"
          find "$RUNNER_TEMP" -name "*.ipa" 2>/dev/null

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes_s-unsigned
          path: ${{ runner.temp }}/ipa/

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -n "error:" "$RUNNER_TEMP/build.log" 2>/dev/null | head -30
          echo "=== EXPORT ERRORS ==="
          grep -n "error:" "$RUNNER_TEMP/export.log" 2>/dev/null | head -30
