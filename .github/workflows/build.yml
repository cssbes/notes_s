name: Build unsigned IPA

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build unsigned archive
        run: |
          xcodebuild clean archive \
            -project notes_s.xcodeproj \
            -scheme notes_s \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/notes_s.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Archive build log on failure
        if: failure()
        run: |
          echo "ARCHIVE FAILED. Errors from build log:"
          grep -n "error:" "$RUNNER_TEMP/build.log" | head -30
          echo "---"
          grep -E "(ARCHIVE|BUILD) (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log"

      - name: Export unsigned IPA
        if: success()
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/notes_s.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notes_s-unsigned
          path: ${{ runner.temp }}/ipa/*.ipa
